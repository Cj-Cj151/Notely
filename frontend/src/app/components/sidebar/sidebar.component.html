<aside class="sidebar" [class.mobile-open]="mobileNavigationOpen">
  <div class="sidebar-header">
    <a class="brand" href="/" aria-label="Notely home">
      <span>notely</span>
    </a>

    <button
      mat-flat-button
      class="new-note-button"
      aria-label="New note"
      (click)="createNote.emit()"
    >
      <span class="new-note-icon" aria-hidden="true">＋</span>
      <span class="new-note-label">New note</span>
    </button>

    <button
      class="mobile-nav-toggle"
      type="button"
      aria-controls="main-navigation"
      [attr.aria-expanded]="mobileNavigationOpen"
      [attr.aria-label]="mobileNavigationOpen ? 'Close section navigation' : 'Open section navigation'"
      (click)="toggleMobileNavigation()"
    >
      <span>{{ mobileNavigationOpen ? 'Close' : 'Sections' }}</span>
      <span class="mobile-nav-chevron" aria-hidden="true"></span>
    </button>
  </div>

  <nav
    id="main-navigation"
    class="navigation"
    aria-label="Main navigation"
    (click)="closeMobileNavigation()"
  >
    <span class="section-label">Workspace</span>
    <button
      class="nav-item"
      type="button"
      [class.active]="section === 'all'"
      [attr.aria-current]="section === 'all' ? 'page' : null"
      (click)="sectionSelected.emit('all')"
    >
      <svg
        class="nav-icon"
        aria-hidden="true"
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
      >
        <g clip-path="url(#clip0_4418_9479)">
          <path
            d="M21.6601 10.4405L20.6801 14.6205C19.8401 18.2305 18.1801 19.6905 15.0601 19.3905C14.5601 19.3505 14.0201 19.2605 13.4401 19.1205L11.7601 18.7205C7.59006 17.7305 6.30006 15.6705 7.28006 11.4905L8.26006 7.3005C8.46006 6.4505 8.70006 5.7105 9.00006 5.1005C10.1701 2.6805 12.1601 2.0305 15.5001 2.8205L17.1701 3.2105C21.3601 4.1905 22.6401 6.2605 21.6601 10.4405Z"
            stroke="#ffffff"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M15.06 19.3896C14.44 19.8096 13.66 20.1596 12.71 20.4696L11.13 20.9896C7.15998 22.2696 5.06997 21.1996 3.77997 17.2296L2.49997 13.2796C1.21997 9.30961 2.27997 7.20961 6.24997 5.92961L7.82997 5.40961C8.23997 5.27961 8.62997 5.16961 8.99997 5.09961C8.69997 5.70961 8.45997 6.44961 8.25997 7.29961L7.27997 11.4896C6.29997 15.6696 7.58998 17.7296 11.76 18.7196L13.44 19.1196C14.02 19.2596 14.56 19.3496 15.06 19.3896Z"
            stroke="#ffffff"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M12.64 8.5293L17.49 9.7593"
            stroke="#ffffff"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M11.66 12.4004L14.56 13.1404"
            stroke="#ffffff"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </g>
        <defs>
          <clipPath id="clip0_4418_9479">
            <rect width="24" height="24" fill="white" />
          </clipPath>
        </defs>
      </svg>
      <span>All notes</span>
    </button>
    <button
      class="nav-item"
      type="button"
      [class.active]="section === 'favorites'"
      [attr.aria-current]="section === 'favorites' ? 'page' : null"
      (click)="sectionSelected.emit('favorites')"
    >
      <svg
        class="nav-icon"
        aria-hidden="true"
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
      >
        <g clip-path="url(#clip0_4418_9478)">
          <path
            d="M14 2C16 2 17 3.01 17 5.03V12.08C17 14.07 15.59 14.84 13.86 13.8L12.54 13C12.24 12.82 11.76 12.82 11.46 13L10.14 13.8C8.41 14.84 7 14.07 7 12.08V5.03C7 3.01 8 2 10 2H14Z"
            stroke="#ffffff"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M6.82 4.99094C3.41 5.56094 2 7.66094 2 11.9009V14.9309C2 19.9809 4 22.0009 9 22.0009H15C20 22.0009 22 19.9809 22 14.9309V11.9009C22 7.59094 20.54 5.48094 17 4.96094"
            stroke="#ffffff"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </g>
        <defs>
          <clipPath id="clip0_4418_9478">
            <rect width="24" height="24" fill="white" />
          </clipPath>
        </defs>
      </svg>
      <span>Favorites</span>
    </button>
    <button
      class="nav-item"
      type="button"
      [class.active]="section === 'archive'"
      [attr.aria-current]="section === 'archive' ? 'page' : null"
      (click)="sectionSelected.emit('archive')"
    >
      <svg
        class="nav-icon"
        aria-hidden="true"
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
      >
        <g clip-path="url(#clip0_4418_9711)">
          <path
            d="M22 10V15C22 20 20 22 15 22H9C4 22 2 20 2 15V9C2 4 4 2 9 2H14"
            stroke="#ffffff"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M22 10H18C15 10 14 9 14 6V2L22 10Z"
            stroke="#ffffff"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </g>
        <defs>
          <clipPath id="clip0_4418_9711">
            <rect width="24" height="24" fill="white" />
          </clipPath>
        </defs>
      </svg>
      <span>Archive</span>
    </button>

    <div class="collection-heading">
      <span class="section-label">Collections</span>
      <span class="collection-lock" aria-hidden="true">—</span>
    </div>
    <button
      class="nav-item collection-item"
      type="button"
      [class.active]="section === 'journal'"
      [attr.aria-current]="section === 'journal' ? 'page' : null"
      (click)="sectionSelected.emit('journal')"
    >
      <span class="collection-dot journal"></span>
      <span>Journal</span>
    </button>
    <button
      class="nav-item collection-item"
      type="button"
      [class.active]="section === 'research'"
      [attr.aria-current]="section === 'research' ? 'page' : null"
      (click)="sectionSelected.emit('research')"
    >
      <span class="collection-dot research"></span>
      <span>Research</span>
    </button>
    <button
      class="nav-item collection-item"
      type="button"
      [class.active]="section === 'drafts'"
      [attr.aria-current]="section === 'drafts' ? 'page' : null"
      (click)="sectionSelected.emit('drafts')"
    >
      <span class="collection-dot drafts"></span>
      <span>Drafts</span>
    </button>
  </nav>
</aside>
